<!DOCTYPE html>
<html>
<meta name="content-type" content="text/html; charset=UTF-8">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勤.专用</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    width:100%;
    height:100%;
    background-color:#affff;
    overflow:hidden;
}
body{
    display:flex;
}
table{
    width:100vw !important;
    height:100vh !important;
    border-collapse: collapse;
}
td{
    padding:0;
    border:1px solid #333;
}
input{
    width:100% !important;
    height:100% !important;
    border:none;
    outline:none;
    font-size: clamp(22px, 5vw, 60px) !important;
}
#nummessege{
    text-align:right;
    padding-right: 0.5em;
    font-size: clamp(30px,7vw,80px) !important;
}
input[type="button"]{
    background-color:#ffb6c1;
    color:#000;
    cursor:pointer;
}
input[type="button"]:active{
    background-color:#ff8fa3;
}
</style>
<!--将按键内容以字符串形式存储在文字框中当按钮为“=”时，调用eval方法计算结果然后将结果输出文字框中-->
<script type="text/javascript">
var numresult;
var str;

function onclicknum(nums) {
    str = document.getElementById("nummessege");
    str.value = str.value + nums;
}

function onclickclear() {
    str = document.getElementById("nummessege");
    str.value = "";
}
function onclickresult() {
    str = document.getElementById("nummessege");
    numresult = eval(str.value);
    str.value = numresult;
}
</script>
</head>
<body bgcolor="affff" >
<!--定义按键表格,每个按键对应一个事件触发-->
<table border="1" align="center" bgColor="#bbff77"
    style="height: 350px; width: 270px">
    <tr>
        <td colspan="4">
            <input type="text" id="nummessege"
                style="height: 90px; width: 390px; font-size: 50px" />
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="1" id="1" onclick="onclicknum(1)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="2" id="2" onclick="onclicknum(2)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="3" id="3" onclick="onclicknum(3)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="+" id="add" onclick="onclicknum('+')"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="4" id="4" onclick="onclicknum(4)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="5" id="5" onclick="onclicknum(5)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="6" id="6" onclick="onclicknum(6)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="-" id="sub" onclick="onclicknum('-')"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="7" id="7" onclick="onclicknum(7)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="8" id="8" onclick="onclicknum(8)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="9" id="9" onclick="onclicknum(9)"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="*" id="mul" onclick="onclicknum('*')"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <input type="button" value="0" id="0" onclick="onclicknum(0)"
                style="height: 70px; width: 190px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="." id="point" onclick="onclicknum('.')"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
        <td>
            <input type="button" value="/" id="division"
                onclick="onclicknum('/')"
                style="height: 70px; width: 90px; font-size: 35px">
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <input type="button" value="qin" id="clear"
                onclick="onclickclear()"
                style="height: 70px; width: 190px; font-size: 35px" />
        </td>
        <td colspan="2">
            <input type="button" value="=" id="result"
                onclick="onclickresult()"
                style="height: 70px; width: 190px; font-size: 35px" />
        </td>
    </tr>
</table>
</body>
</html>
