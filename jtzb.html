<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭账本</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .charts {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-top: 30px;
        }
        .chart-container {
            width: 48%;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .summary {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 5px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .summary-label {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        
        
        <form id="expenseForm">
            <div class="form-group">
                <label for="date">日期</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="category">分类</label>
                <select id="category" required>
                    <option value="">-- 请选择 --</option>
                    <option value="餐饮">餐饮</option>
                    <option value="购物">购物</option>
                    <option value="交通">交通</option>
                    <option value="住房">住房</option>
                    <option value="娱乐">娱乐</option>
                    <option value="医疗">医疗</option>
                    <option value="教育">教育</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="amount">金额</label>
                <input type="number" id="amount" min="0" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="description">备注</label>
                <input type="text" id="description">
            </div>
            
            <button type="submit">添加记录</button>
        </form>
        
        <div class="summary">
            <div class="summary-item">
                <div class="summary-label">本月支出</div>
                <div class="summary-value" id="monthExpense">¥0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">本月收入</div>
                <div class="summary-value" id="monthIncome">¥0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">结余</div>
                <div class="summary-value" id="monthBalance">¥0.00</div>
            </div>
        </div>
        
        <div class="charts">
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="dailyChart"></canvas>
            </div>
        </div>
        
        <h2>收支记录</h2>
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>分类</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 记录将在这里动态添加 -->
            </tbody>
        </table>
    </div>

    <script>
        // 初始化数据
        let records = JSON.parse(localStorage.getItem('familyLedger')) || [];
        
        // DOM元素
        const expenseForm = document.getElementById('expenseForm');
        const recordsTable = document.getElementById('recordsTable').getElementsByTagName('tbody')[0];
        const monthExpense = document.getElementById('monthExpense');
        const monthIncome = document.getElementById('monthIncome');
        const monthBalance = document.getElementById('monthBalance');
        
        // 初始化日期为今天
        document.getElementById('date').valueAsDate = new Date();
        
        // 表单提交
        expenseForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const record = {
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value
            };
            
            records.push(record);
            saveRecords();
            renderRecords();
            updateCharts();
            updateSummary();
            
            // 重置表单
            expenseForm.reset();
            document.getElementById('date').valueAsDate = new Date();
        });
        
        // 保存记录到本地存储
        function saveRecords() {
            localStorage.setItem('familyLedger', JSON.stringify(records));
        }
        
        // 渲染记录表格
        function renderRecords() {
            recordsTable.innerHTML = '';
            
            records.forEach((record, index) => {
                const row = recordsTable.insertRow();
                
                row.insertCell(0).textContent = record.date;
                row.insertCell(1).textContent = record.category;
                row.insertCell(2).textContent = '¥' + record.amount.toFixed(2);
                row.insertCell(3).textContent = record.description || '-';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '删除';
                deleteBtn.style.backgroundColor = '#f44336';
                deleteBtn.style.padding = '5px 10px';
                deleteBtn.style.fontSize = '14px';
                deleteBtn.addEventListener('click', () => {
                    records.splice(index, 1);
                    saveRecords();
                    renderRecords();
                    updateCharts();
                    updateSummary();
                });
                
                const actionCell = row.insertCell(4);
                actionCell.appendChild(deleteBtn);
            });
        }
        
        // 更新图表
        function updateCharts() {
            updateCategoryChart();
            updateDailyChart();
        }
        
        // 分类图表
        let categoryChart;
        function updateCategoryChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            // 按分类汇总
            const categories = {};
            records.forEach(record => {
                if (!categories[record.category]) {
                    categories[record.category] = 0;
                }
                categories[record.category] += record.amount;
            });
            
            const labels = Object.keys(categories);
            const data = Object.values(categories);
            
            if (categoryChart) {
                categoryChart.data.labels = labels;
                categoryChart.data.datasets[0].data = data;
                categoryChart.update();
            } else {
                categoryChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: [
                                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', 
                                '#9966FF', '#FF9F40', '#8AC24A', '#607D8B'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: '支出分类占比'
                            }
                        }
                    }
                });
            }
        }
        
        // 每日支出图表
        let dailyChart;
        function updateDailyChart() {
            const ctx = document.getElementById('dailyChart').getContext('2d');
            
            // 按日期汇总
            const dailyData = {};
            records.forEach(record => {
                if (!dailyData[record.date]) {
                    dailyData[record.date] = 0;
                }
                dailyData[record.date] += record.amount;
            });
            
            // 按日期排序
            const sortedDates = Object.keys(dailyData).sort();
            const amounts = sortedDates.map(date => dailyData[date]);
            
            if (dailyChart) {
                dailyChart.data.labels = sortedDates;
                dailyChart.data.datasets[0].data = amounts;
                dailyChart.update();
            } else {
                dailyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: sortedDates,
                        datasets: [{
                            label: '每日支出',
                            data: amounts,
                            backgroundColor: '#36A2EB'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: '每日支出趋势'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }
        
        // 更新摘要信息
        function updateSummary() {
            const currentMonth = new Date().toISOString().slice(0, 7);
            
            const monthRecords = records.filter(record => 
                record.date.startsWith(currentMonth)
            );
            
            const expense = monthRecords
                .filter(record => record.amount > 0)
                .reduce((sum, record) => sum + record.amount, 0);
            
            // 这里假设收入记录为负数（可以根据需要修改）
            const income = monthRecords
                .filter(record => record.amount < 0)
                .reduce((sum, record) => sum + Math.abs(record.amount), 0);
            
            monthExpense.textContent = '¥' + expense.toFixed(2);
            monthIncome.textContent = '¥' + income.toFixed(2);
            monthBalance.textContent = '¥' + (income - expense).toFixed(2);
        }
        
        // 初始化
        renderRecords();
        updateCharts();
        updateSummary();
    </script>
</body>
</html>
