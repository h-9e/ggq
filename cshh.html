<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彩色绘画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }
        .controls {
            background-color: #fff;
            padding: 12px 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            z-index: 10;
        }
        .color-section {
            margin-bottom: 12px;
        }
        .color-section h3 {
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
        }
        .preset-colors {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .control-group {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-group label {
            font-size: 14px;
            color: #444;
        }
        button, input {
            padding: 7px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #customColor {
            width: 46px;
            height: 34px;
            padding: 2px;
        }
        #brushSize {
            width: 70px;
        }
        /* 画布填满剩下屏幕 */
        #canvas {
            display: block;
            background-color: #fff;
            cursor: crosshair;
            width: 100vw;
            flex: 1;
        }
        .wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="controls">
            <div class="color-section">
               
                <div class="preset-colors">
                    <button class="color-btn" style="background-color: #ff3e3e;"></button>
                    <button class="color-btn" style="background-color: #ff9d3e;"></button>
                    <button class="color-btn" style="background-color: #fff33e;"></button>
                    <button class="color-btn" style="background-color: #3eff53;"></button>
                    <button class="color-btn" style="background-color: #3effe6;"></button>
                    <button class="color-btn" style="background-color: #3e7dff;"></button>
                    <button class="color-btn" style="background-color: #a23eff;"></button>
                    <button class="color-btn" style="background-color: #ff3ed6;"></button>
                    <button class="color-btn" style="background-color: #000000;"></button>
                    <button class="color-btn" style="background-color: #ffffff; border: 1px solid #ddd;"></button>
                </div>
            </div>
            
            <div class="control-group">
                <label for="customColor">自定义颜色:</label>
                <input type="color" id="customColor" value="#000000">
                
                <label for="brushSize">画笔大小:</label>
                <input type="number" id="brushSize" min="1" max="100" value="5">
                
                <button id="clearCanvas">清空画布</button>
            </div>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const customColor = document.getElementById('customColor');
        const brushSize = document.getElementById('brushSize');
        const clearCanvas = document.getElementById('clearCanvas');
        const colorButtons = document.querySelectorAll('.color-btn');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let savedImage = null; // 保存画面，resize不丢图

        // 设置画布物理尺寸，同时保留之前绘制内容
        function setupCanvas() {
            savedImage = canvas.toDataURL('image/png');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            ctx.strokeStyle = customColor.value;
            ctx.lineWidth = brushSize.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 恢复画面
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = savedImage;
        }

        function startDraw(e) {
            isDrawing = true;
            [lastX, lastY] = getCanvasPosition(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            const [x, y] = getCanvasPosition(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            [lastX, lastY] = [x, y];
        }

        function endDraw() {
            isDrawing = false;
        }

        function getCanvasPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return [
                clientX - rect.left,
                clientY - rect.top
            ];
        }

        // 鼠标
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseout', endDraw);

        // 触摸，禁止滚动
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDraw(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        }, { passive: false });
        canvas.addEventListener('touchend', endDraw);

        customColor.addEventListener('input', () => {
            ctx.strokeStyle = customColor.value;
        });

        colorButtons.forEach(button => {
            button.addEventListener('click', () => {
                const color = button.style.backgroundColor;
                ctx.strokeStyle = color;
                customColor.value = rgbToHex(color);
            });
        });

        brushSize.addEventListener('input', () => {
            ctx.lineWidth = brushSize.value;
        });

        clearCanvas.addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        function rgbToHex(rgb) {
            if (rgb === 'white') return '#ffffff';
            const rgbArr = rgb.match(/\d+/g);
            return `#${((1 << 24) + (parseInt(rgbArr[0]) << 16) + (parseInt(rgbArr[1]) << 8) + parseInt(rgbArr[2])).toString(16).slice(1)}`;
        }

        setupCanvas();
        window.addEventListener('resize', setupCanvas);
    </script>
</body>
</html>
